<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 140" width="1100" height="140" role="img" aria-label="Animated Python snake">
  <defs>
    <linearGradient id="gradBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#306998"/>
      <stop offset="1" stop-color="#2b6ca3"/>
    </linearGradient>
    <linearGradient id="gradYellow" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#ffde57"/>
    </linearGradient>
    <!-- path the snake will follow -->
    <path id="snakePath" d="M-120 70 C 80 0, 280 0, 420 70 C 560 140, 760 140, 900 70 C 1040 0, 1240 0, 1360 70" />
  </defs>

  <!-- transparent background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Body strokes (two layers for python colors) -->
  <use href="#snakePath" stroke="url(#gradBlue)" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <use href="#snakePath" stroke="url(#gradYellow)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- animated python head image following the path -->
  <g id="headGroup" transform="translate(-24,-24)">
    <image id="pylogo" href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" width="48" height="48" />
    <animateMotion xlink:href="#pylogo" dur="10s" repeatCount="indefinite" rotate="auto">
      <mpath href="#snakePath" />
    </animateMotion>
  </g>

  <!-- subtle bobbing to add life -->
  <animateTransform attributeName="transform" attributeType="XML" type="translate"
    values="0 0; 0 0.8; 0 0" dur="1.2s" repeatCount="indefinite" />

  <!-- accessibility label text -->
  <text x="12" y="18" font-size="12" font-family="Verdana, Arial, sans-serif" fill="#333">Python-styled contribution snake — Python & Java friendly 🐍☕</text>
</svg>
